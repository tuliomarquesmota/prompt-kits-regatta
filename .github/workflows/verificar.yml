# Roda em todo Pull Request e em todo envio para a main.
# Se falhar, o PR mostra um X vermelho e não deve ser juntado até corrigir.
name: Verificar

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatação (Prettier)
        run: npm run format:check
      - name: Tipos (TypeScript)
        run: npm run typecheck
      - name: Testes do leitor de etiquetas
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-de-exemplo
